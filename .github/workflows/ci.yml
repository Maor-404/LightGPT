name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements.txt || true

      - name: Create tiny checkpoint
        run: |
          python - << 'PY'
          import torch
          from lightgpt import LightGPT
          model = LightGPT(mode='underkill', max_seq_len=32)
          ck = {'model_state_dict': model.state_dict()}
          torch.save(ck, 'lightgpt.chkpt')
          print('Saved lightgpt.chkpt')
          PY

      - name: Export NPZ weights
        run: |
          python scripts/export_npz.py lightgpt.chkpt lightgpt_weights.npz

      - name: Run model checks
        run: |
          python examples/model_check.py --out model_check_report.txt --npz lightgpt_weights.npz --mode underkill || true

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: model-check-report
          path: model_check_report.txt
