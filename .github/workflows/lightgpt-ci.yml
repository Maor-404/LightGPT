name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run a quick generation demo
        run: |
          python -c "from lightgpt.model import LightGPT; print(LightGPT().generate('Hello'))"
      - name: Export ONNX model
        run: |
          python -m lightgpt.export_onnx --model EleutherAI/gpt-neo-125M --output lightgpt_neo.onnx
      - name: Verify ONNX file exists
        run: ls -lh lightgpt_neo.onnx
